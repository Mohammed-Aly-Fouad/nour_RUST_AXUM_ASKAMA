{% if categories.is_empty() %}
    <div class="search-dropdown-item no-results">
        <span>لا توجد نتائج تطابق "{{ query }}"</span>
    </div>
{% else %}
   {% for category in categories %}
    <!-- غيّر الرابط هنا ليكون /edit/id بدلاً من ?edit=id -->
    <a href="/web/brands/edit/{{ category.id }}" class="search-dropdown-item">
        <span class="item-name-ar">{{ category.name_ar }}</span>
        <span class="item-name-en">{{ category.name }}</span>
    </a>
{% endfor %}
{% endif %}
