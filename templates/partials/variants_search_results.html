{% if variants.is_empty() %}
    <div class="search-dropdown-item no-results">
        <span>لا توجد نتائج تطابق "{{ query }}"</span>
    </div>
{% else %}
   {% for variant in variants %}
    <!-- غيّر الرابط هنا ليكون /edit/id بدلاً من ?edit=id -->
    <a href="/web/brands/edit/{{ variant.id }}" class="search-dropdown-item">
        <span class="item-name-ar">{{ variant.name_ar }}</span>
        <span class="item-name-en">{{ variant.name }}</span>
    </a>
{% endfor %}
{% endif %}
