<!-- ==================== Modal (Create / Edit) ==================== -->
<div
  id="brand-modal"
  class="modal-overlay {% if edit_product.is_some() %}active{% endif %}"
>
  <div class="modal-card">
    <div class="modal-header">
      <h2>
        {% if edit_product.is_some() %}تعديل منتج{% else %}إضافة منتج جديد{%
        endif %}
      </h2>
      <a
        href="/web/product"
        class="modal-close"
        onclick="closeBrandModal(event)"
        >&times;</a
      >
    </div>

    {% if let Some(product) = edit_product %}
    <form method="post" action="/web/products/update/{{ product.id }}">
      <div class="field">
        <label for="name">الاسم بالإنجليزية</label>
        <input
          type="text"
          id="name"
          name="name"
          value="{{ product.name }}"
          maxlength="100"
          required
        />
      </div>
      <div class="field">
        <label for="name_ar">الاسم بالعربية</label>
        <input
          type="text"
          id="name_ar"
          name="name_ar"
          value="{{ product.name_ar }}"
          maxlength="100"
          required
        />
      </div>
      <div class="field">
        <label for="parent_id">القسم الخاص بالمنتج</label>
        <select id="parent_id" name="category_id" required>
          <option value="">-- اختر القسم --</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}">
            {{ cat.name_ar }} 
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="notes">ملاحظات (اختياري)</label>
        <textarea id="notes" name="notes">
{% if let Some(notes) = product.notes %}{{ notes }}{% endif %}</textarea
        >
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
        <a href="/web/products" class="btn btn-ghost">إلغاء</a>
      </div>
    </form>
    {% else %}
    <form method="post" action="/web/products">
      <div class="field">
        <label for="name">الاسم بالإنجليزية</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="e.g. Nike"
          maxlength="100"
          required
        />
      </div>
      <div class="field">
        <label for="name_ar">الاسم بالعربية</label>
        <input
          type="text"
          id="name_ar"
          name="name_ar"
          placeholder="مثال: نايك"
          maxlength="100"
          required
        />
      </div>

      <div class="field">
        <label for="parent_id">القسم الخاص بالمنتج</label>
        <select id="parent_id" name="category_id" required>
          <option value="">-- اختر القسم --</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}">
            {{ cat.name_ar }} 
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="notes">ملاحظات (اختياري)</label>
        <textarea
          id="notes"
          name="notes"
          placeholder="أي ملاحظات إضافية عن المنتج"
        ></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">إضافة المنتج</button>
        <button type="button" class="btn btn-ghost" onclick="closeBrandModal()">
          إلغاء
        </button>
      </div>
    </form>
    {% endif %}
  </div>
</div>
