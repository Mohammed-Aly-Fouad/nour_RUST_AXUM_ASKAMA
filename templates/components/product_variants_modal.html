<!-- ==================== Modal (Create / Edit) ==================== -->
<div id="brand-modal" class="modal-overlay {% if edit_variant.is_some() %}active{% endif %}">
  <div class="modal-card">
    <div class="modal-header">
      <h2>{% if edit_variant.is_some() %}تعديل صنف{% else %}إضافة صنف جديد{% endif %}</h2>
      <a href="/web/product_variants" class="modal-close" onclick="closeBrandModal(event)">&times;</a>
    </div>

    {% if let Some(variant) = edit_variant %}
      <form method="post" action="/web/product_variants/update/{{ variant.id }}">
        <div class="field">
          <label for="name">الاسم بالإنجليزية</label>
          <input type="text" id="name" name="name" value="{{ variant.name }}" maxlength="100" required>
        </div>
        <div class="field">
          <label for="name_ar">الاسم بالعربية</label>
          <input type="text" id="name_ar" name="name_ar" value="{{ variant.name_ar }}" maxlength="100" required>
        </div>
        <div class="field">
          <label for="name_ar">product_id</label>
          <input type="text" id="name_ar" name="product_id" value="{{ variant.product_id }}" maxlength="100" required>
        </div>
        <div class="field">
          <label for="notes">ملاحظات (اختياري)</label>
          <textarea id="notes" name="notes">{% if let Some(notes) = variant.notes %}{{ notes }}{% endif %}</textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
          <a href="/web/product_variants" class="btn btn-ghost">إلغاء</a>
        </div>
      </form>
    {% else %}
      <form method="post" action="/web/product_variants">
        <div class="field">
          <label for="name">الاسم بالإنجليزية</label>
          <input type="text" id="name" name="name" placeholder="e.g. Nike" maxlength="100" required>
        </div>
        <div class="field">
          <label for="name_ar">الاسم بالعربية</label>
          <input type="text" id="name_ar" name="name_ar" placeholder="مثال: نايك" maxlength="100" required>
        </div>
        <div class="field">
          <label for="notes">ملاحظات (اختياري)</label>
          <textarea id="notes" name="notes" placeholder="أي ملاحظات إضافية عن البراند"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">إضافة الصنف</button>
          <button type="button" class="btn btn-ghost" onclick="closeBrandModal()">إلغاء</button>
        </div>
      </form>
    {% endif %}
  </div>
</div>
