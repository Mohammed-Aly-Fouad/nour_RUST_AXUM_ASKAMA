<!-- ==================== Modal (Create / Edit) ==================== -->
<div id="category-modal" class="modal-overlay {% if edit_category.is_some() %}active{% endif %}">
  <div class="modal-card">
    <div class="modal-header">
      <h2>{% if edit_category.is_some() %}تعديل الفئة{% else %}إضافة فئة جديدة{% endif %}</h2>
      <a href="/web/categories" class="modal-close" onclick="closeCategoryModal(event)">&times;</a>
    </div>

    {% if let Some(edit_category) = edit_category %}
      <form method="post" action="/web/categories/update/{{ edit_category.id }}">
        <div class="field">
          <label for="name">الاسم بالإنجليزية</label>
          <input type="text" id="name" name="name" value="{{ edit_category.name }}" maxlength="50" required>
        </div>
        <div class="field">
          <label for="name_ar">الاسم بالعربية</label>
          <input type="text" id="name_ar" name="name_ar" value="{{ edit_category.name_ar }}" maxlength="50" required>
        </div>
        <div class="field">
          <label for="parent_id">الفئة الرئيسية (اختياري)</label>
          <select id="parent_id" name="parent_id">
            <option value="">-- بدون أب (فئة رئيسية جذرية) --</option>
            {% for cat in root_categories %}
              {% if cat.id != edit_category.id %}
                <option value="{{ cat.id }}" {% if edit_category.parent_id.is_some() && edit_category.parent_id.unwrap() == cat.id %}selected{% endif %}>
                  {{ cat.name_ar }} ({{ cat.name }})
                </option>
              {% endif %}
            {% endfor %}
          </select>
          <p class="field-hint">فقط الفئات الجذعية تظهر هنا كخيارات أب.</p>
        </div>
        <div class="field">
          <label for="notes">ملاحظات (اختياري)</label>
          <textarea id="notes" name="notes">{% if let Some(notes) = edit_category.notes %}{{ notes }}{% endif %}</textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
          <a href="/web/categories" class="btn btn-ghost">إلغاء</a>
        </div>
      </form>
    {% else %}
      <form method="post" action="/web/categories">
        <div class="field">
          <label for="name">الاسم بالإنجليزية</label>
          <input type="text" id="name" name="name" placeholder="e.g. Shoes" maxlength="50" required>
        </div>
        <div class="field">
          <label for="name_ar">الاسم بالعربية</label>
          <input type="text" id="name_ar" name="name_ar" placeholder="مثال: أحذية" maxlength="50" required>
        </div>
        <div class="field">
          <label for="parent_id">الفئة الرئيسية (اختياري)</label>
          <select id="parent_id" name="parent_id">
            <option value="">-- بدون أب (فئة رئيسية جذرية) --</option>
            {% for cat in root_categories %}
              <option value="{{ cat.id }}">{{ cat.name_ar }} ({{ cat.name }})</option>
            {% endfor %}
          </select>
          <p class="field-hint">فقط الفئات الجذعية تظهر هنا كخيارات أب.</p>
        </div>
        <div class="field">
          <label for="notes">ملاحظات (اختياري)</label>
          <textarea id="notes" name="notes" placeholder="أي ملاحظات إضافية عن الفئة"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">إضافة الفئة</button>
          <button type="button" class="btn btn-ghost" onclick="closeCategoryModal()">إلغاء</button>
        </div>
      </form>
    {% endif %}
  </div>
</div>
