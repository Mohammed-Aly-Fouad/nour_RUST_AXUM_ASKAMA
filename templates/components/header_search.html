<header class="page-header">
  <div class="header-right">
    <a href="/web/brands/new" class="btn btn-primary">+ إضافة براند جديد</a>
  </div>

  <div class="header-center search-wrapper">
    <input 
      type="search" 
      name="q" 
      class="search-input" 
      placeholder="بحث عن براند..." 
      autocomplete="off"
      hx-get="/web/brands/search" 
      hx-trigger="keyup changed delay:300ms, search" 
      hx-target="#search-results-dropdown" 
      hx-indicator="#search-spinner"
    />
    <div id="search-spinner" class="htmx-indicator spinner-sm"></div>
    
    <!-- Dynamic Dropdown Container for HTMX Swaps -->
    <div id="search-results-dropdown" class="search-dropdown"></div>
  </div>

  <div class="header-left page-title-group">
    <h1 class="page-title">إدارة البراندات</h1>
    <span class="badge count-badge">{{ total_count }} براند</span>
  </div>
</header>
